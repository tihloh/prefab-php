name: Fix API Reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-api-reference.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch audited API rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('website/assets/js/app.js')
          s=p.read_text()
          s=s.replace("['UserFactoryInterface','make(row, map)','Extension point for converting a provider row into a user object.']", "['UserFactoryInterface','make(id, name, email, active, attributes=[])','Extension point for creating the normalized PrefabUser returned by a custom/provider implementation.']")
          s=s.replace("['Notification','isRead()','Check whether readAt has been set.']", "['Notification','isRead() / isUnread()','Check the notification read state from readAt.']")
          s=s.replace("['Attachment','fromData(data, name, mime?)','Create an in-memory attachment.']", "['Attachment','fromData(contents, name, mime?)','Create an in-memory attachment.'],['Attachment','data()','Return attachment bytes, reading the source file when necessary.'],['Attachment','path, contents, name, mime','Public immutable attachment source/name/type data.']")
          s=s.replace("['DeliveryResult','successful, channel, messageId, error, meta','Read delivery success/failure and provider result information.']", "['DeliveryResult','successful, channel, messageId, error, metadata','Read delivery success/failure and provider result information.'],['DeliveryResult','failed()','Convenience check that returns the opposite of successful.']")
          s=s.replace("['FileDownload','stream/filename/size/mime/inline data','Value object used by the host HTTP layer to send a stored file.']", "['FileDownload','stream(), filename(), size(), mime(), inline()','Read the download stream and response metadata.'],['FileDownload','headers()','Return Content-Type, Content-Length and Content-Disposition headers for the host HTTP layer.']")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/js/app.js
          git commit -m "Correct audited API reference details"
          git push
