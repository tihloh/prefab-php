name: Materialize Tutorial Interoperability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-interoperability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write interoperability into tutorial HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('website/assets/js/interoperability.js','utf8');
          const start = source.indexOf('const integrations = {');
          const end = source.indexOf('\n  const data = integrations[current];');
          if(start < 0 || end < 0) throw new Error('integration data not found');
          const expression = source.slice(start + 'const integrations = '.length, end).trim().replace(/;$/,'');
          const integrations = vm.runInNewContext('(' + expression + ')');
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          for (const [file,data] of Object.entries(integrations)) {
            const path = 'website/' + file;
            let html = fs.readFileSync(path,'utf8');
            html = html.replace(/<section class="interop-reference-static">[\s\S]*?<\/section>/,'');
            const rows = data.rows.map(r => `<tr><td><code>${esc(r[0])}</code></td><td><strong>${esc(r[1])}</strong></td><td><code>${esc(r[2])}</code></td><td>${esc(r[3])}</td></tr>`).join('');
            let title = file === 'logs.html' ? 'Automatic logging and module coexistence' : 'Works with other Prefab modules';
            let extra = '';
            if(file === 'logs.html') extra = `<h3>What automatic logging means</h3><p>Automatic logging does not mean that Logs watches the database. Compatible Prefab modules create a structured audit payload while they perform an operation. If the logger capability is available, Prefab forwards that payload to Logs automatically.</p><pre><code>UserManager::update()\n    ↓\ncreates user.updated payload\n    ↓\nPrefab runtime finds logger capability\n    ↓\nLogManager records it\n    ↓\nAuth actor is included when available</code></pre>`;
            const section = `<section class="interop-reference-static"><h2>${title}</h2><p>${esc(data.intro)}</p><div class="api-table-wrap"><table class="api-table interop-table"><thead><tr><th>Module</th><th>Integration</th><th>How</th><th>What happens</th></tr></thead><tbody>${rows}</tbody></table></div>${extra}<div class="callout"><b>Important:</b> ${esc(data.note)}</div></section>`;
            if(!html.includes('</article>')) throw new Error(file + ': article close missing');
            html = html.replace('</article>', section + '</article>');
            fs.writeFileSync(path, html);
          }
          let app = fs.readFileSync('website/assets/js/app.js','utf8');
          app = app.replace(/\n?\/\/ Module coexistence and automatic-integration reference\.\s*\nconst interopScript=document\.createElement\('script'\);\s*\ninteropScript\.src='assets\/js\/interoperability\.js';\s*\ndocument\.body\.appendChild\(interopScript\);?/m,'');
          fs.writeFileSync('website/assets/js/app.js', app);
          NODE
      - name: Commit tutorial pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/*.html website/assets/js/app.js
          git commit -m "Write module interoperability into tutorial pages"
          git push
