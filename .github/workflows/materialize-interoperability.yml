name: Materialize Tutorial Interoperability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-interoperability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize interoperability sections
        run: |
          echo '' | base64 -d > /tmp/materialize.py
          python3 /tmp/materialize.py
      - name: Commit tutorial pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/*.html website/assets/js/app.js
          git commit -m "Write module interoperability into tutorial pages"
          git push
