name: Add Interoperability Loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-interoperability-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append interoperability loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('website/assets/js/app.js')
          s=p.read_text()
          marker="assets/js/interoperability.js"
          if marker not in s:
              s += "\n// Module coexistence and automatic-integration reference.\nconst interopScript=document.createElement('script');\ninteropScript.src='assets/js/interoperability.js';\ndocument.body.appendChild(interopScript);\n"
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/assets/js/app.js
          git commit -m "Show interoperability in every module tutorial"
          git push
