name: Prefab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  package-validation:
    name: Validate ${{ matrix.package }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        package: [core, users, auth, permissions, logs, routes, input, live, theme, files, messaging, notifications]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, fileinfo
      - name: Validate composer.json
        working-directory: packages/${{ matrix.package }}
        run: composer validate --strict
      - name: Use monorepo Core
        if: ${{ matrix.package != 'core' }}
        working-directory: packages/${{ matrix.package }}
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - name: Install package
        working-directory: packages/${{ matrix.package }}
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: find packages/${{ matrix.package }}/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: pdo, pdo_sqlite
      - working-directory: packages/core
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/core
        run: php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php

  input-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: fileinfo
      - working-directory: packages/input
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: packages/input
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/input
        run: php tests/smoke.php

  files-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: fileinfo
      - working-directory: packages/files
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: packages/files
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/files
        run: php tests/smoke.php

  messaging-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - working-directory: packages/messaging
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: packages/messaging
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/messaging
        run: php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php

  notifications-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: pdo, pdo_sqlite
      - working-directory: packages/notifications
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: packages/notifications
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/notifications
        run: php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php


  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - working-directory: packages/live
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: packages/live
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/live
        run: php -d zend.assertions=1 -d assert.exception=1 tests/smoke.php

  theme-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: zip
      - working-directory: packages/theme
        run: composer config repositories.prefab-core '{"type":"path","url":"../core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: packages/theme
        run: composer install --no-interaction --prefer-dist --no-progress
      - working-directory: packages/theme
        run: php -d zend.assertions=1 -d assert.exception=1 tests/run.php
      - name: Theme JS syntax check
        run: node --check packages/theme/assets/theme.js

  theme-showcase-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      - working-directory: packages/theme/examples/theme-showcase
        run: composer update --no-interaction --prefer-dist --no-progress
      - run: php -l packages/theme/examples/theme-showcase/index.php
      - working-directory: packages/theme/examples/theme-showcase
        run: php index.php > /tmp/theme-showcase.html
      - run: |
          grep -q 'pf-shell' /tmp/theme-showcase.html
          grep -q 'pf:theme-mode="toggle"' /tmp/theme-showcase.html
          grep -q 'pf:theme-accent="purple"' /tmp/theme-showcase.html
          grep -q 'type="color"' /tmp/theme-showcase.html
          grep -q 'Theme & Component Showcase' /tmp/theme-showcase.html
          grep -q 'Windows 11' /tmp/theme-showcase.html
          grep -q 'VS Code' /tmp/theme-showcase.html
          grep -q 'Minimal' /tmp/theme-showcase.html
          grep -q 'Ubuntu' /tmp/theme-showcase.html
          grep -q 'macOS' /tmp/theme-showcase.html
          grep -q 'Android' /tmp/theme-showcase.html
          grep -q 'Glass' /tmp/theme-showcase.html
          grep -q 'Enterprise' /tmp/theme-showcase.html
          grep -q 'SaaS' /tmp/theme-showcase.html
          grep -q 'Commerce' /tmp/theme-showcase.html
          grep -q 'Finance' /tmp/theme-showcase.html
          grep -q 'Developer' /tmp/theme-showcase.html

  sqlite-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite
      - working-directory: examples/database-integration-test
        run: composer config repositories.prefab-core '{"type":"path","url":"../../packages/core","options":{"symlink":false,"versions":{"tihloh/prefab-core":"0.4.0"}}}'
      - working-directory: examples/database-integration-test
        run: composer update --no-interaction --prefer-dist --no-progress
      - run: php -l examples/database-integration-test/index.php
      - working-directory: examples/database-integration-test
        run: php -r "require 'vendor/autoload.php'; new Tihloh\\Prefab\\Core\\Database\\DatabaseManager(new PDO('sqlite::memory:')); new Tihloh\\Prefab\\Users\\Services\\UserManager(); new Tihloh\\Prefab\\Auth\\Services\\AuthManager(); new Tihloh\\Prefab\\Permissions\\Services\\PermissionManager(['definitions' => []]); new Tihloh\\Prefab\\Logs\\Services\\LogManager(); echo 'Prefab integration OK', PHP_EOL;"
