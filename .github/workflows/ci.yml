name: Prefab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  package-validation:
    name: Validate ${{ matrix.package }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        package: [database, users, auth, permissions, logs, routes, input]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo, pdo_sqlite, fileinfo

      - name: Validate composer.json
        working-directory: packages/${{ matrix.package }}
        run: composer validate --strict

      - name: Install package
        working-directory: packages/${{ matrix.package }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find packages/${{ matrix.package }}/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  input-smoke:
    name: Prefab Input smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          extensions: fileinfo

      - name: Install Prefab Input
        working-directory: packages/input
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify scalars, wildcard arrays, deep whitelist and uploads
        working-directory: packages/input
        run: php tests/smoke.php

  interoperability-sync:
    name: Verify embedded interoperability files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Synchronize generated files
        run: php tools/sync-prefab-bootstrap.php

      - name: Ensure generated files were already synchronized
        run: git diff --exit-code

  sqlite-integration:
    name: SQLite full-stack integration example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: pdo, pdo_sqlite

      - name: Install database integration example
        working-directory: examples/database-integration-test
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Syntax check example
        run: php -l examples/database-integration-test/index.php

      - name: Load full stack
        working-directory: examples/database-integration-test
        run: php -r "require 'vendor/autoload.php'; new Tihloh\\Prefab\\Database\\Services\\DatabaseManager(new PDO('sqlite::memory:')); new Tihloh\\Prefab\\Users\\Services\\UserManager(); new Tihloh\\Prefab\\Auth\\Services\\AuthManager(); new Tihloh\\Prefab\\Permissions\\Services\\PermissionManager(['definitions' => []]); new Tihloh\\Prefab\\Logs\\Services\\LogManager(); echo 'Prefab integration OK', PHP_EOL;"
